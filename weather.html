<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>weather-app // hunter</title><link rel="stylesheet" href="project.css"></head><body><div class="crt"></div><div class="wrap"><header class="top"><a class="prompt" href="../index.html">&gt;_hunter</a><a class="back" href="../index.html#projects">[ back ]</a></header><main><div class="path">~/projects/weather-app</div><h1 class="title">weather_app<span class="red">_</span></h1><p class="sub">a small terminal weather interface.</p><div class="terminal"><div class="bar">● ● ● <span>weather@local</span></div><div class="content"><form id="form"><div class="row"><input id="city" class="input" value="London" aria-label="city"><button class="button">[ check ]</button></div></form><div class="grid" style="margin-top:12px"><div class="panel"><h2>location</h2><div id="location" class="big">LONDON</div><div id="condition" class="small">clear skies</div></div><div class="panel"><h2>readings</h2><div class="row"><span>temperature</span><span id="temp" class="red">14°C</span></div><div class="row"><span>humidity</span><span id="humidity">72%</span></div><div class="row"><span>wind</span><span id="wind">8 km/h</span></div></div></div></div></div><p class="status">$ status: demo mode // no api key required</p></main></div><script>const data={london:['14°C','72%','8 km/h','clear skies'],tokyo:['21°C','64%','12 km/h','partly cloudy'],newyork:['17°C','58%','15 km/h','clear skies'],manchester:['12°C','79%','18 km/h','overcast']};const f=document.querySelector('#form');f.addEventListener('submit',e=>{e.preventDefault();const c=document.querySelector('#city').value.trim().toLowerCase();const d=data[c]||['16°C','65%','10 km/h','demo conditions'];document.querySelector('#location').textContent=(c||'unknown').toUpperCase();document.querySelector('#temp').textContent=d[0];document.querySelector('#humidity').textContent=d[1];document.querySelector('#wind').textContent=d[2];document.querySelector('#condition').textContent=d[3]})</script></body></html>
