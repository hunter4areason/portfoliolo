<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>task-manager // hunter</title><link rel="stylesheet" href="project.css"></head><body><div class="crt"></div><div class="wrap"><header class="top"><a class="prompt" href="../index.html">&gt;_hunter</a><a class="back" href="../index.html#projects">[ back ]</a></header><main><div class="path">~/projects/task-manager</div><h1 class="title">task_manager<span class="red">_</span></h1><p class="sub">simple local task tracking. nothing fancy.</p><div class="terminal"><div class="bar">● ● ● <span>tasks@local</span></div><div class="content"><div class="row"><input id="task" class="input" placeholder="new task..."><button id="add" class="button">[ add ]</button></div><div id="list" style="margin-top:12px"></div></div></div><p class="status">$ storage: localStorage // tasks survive refresh</p></main></div><script>const key='hunter_tasks';let tasks=JSON.parse(localStorage.getItem(key)||'[]');const list=document.querySelector('#list');function save(){localStorage.setItem(key,JSON.stringify(tasks));render()}function render(){list.innerHTML='';if(!tasks.length){list.innerHTML='<div class="dim">no tasks found.</div>';return}tasks.forEach((t,i)=>{const row=document.createElement('div');row.className='task';row.innerHTML='<input type="checkbox" '+(t.done?'checked':'')+'><span style="'+(t.done?'text-decoration:line-through;color:#8c777c':'')+'">'+t.text.replace(/</g,'&lt;')+'</span><button>[ x ]</button>';row.querySelector('input').onchange=()=>{tasks[i].done=!tasks[i].done;save()};row.querySelector('button').onclick=()=>{tasks.splice(i,1);save()};list.appendChild(row)})}document.querySelector('#add').onclick=()=>{const input=document.querySelector('#task');if(input.value.trim()){tasks.push({text:input.value.trim(),done:false});input.value='';save()}};document.querySelector('#task').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#add').click()});render()</script></body></html>
